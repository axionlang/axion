[package]
name = "axionc"
version = "0.0.0"
edition = "2021"
description = "Fase 1 — esqueleto ambulante do compilador da Axión (parse → typecheck → correr), de raiz em Rust"
publish = false

[[bin]]
name = "axionc"
path = "src/main.rs"

[dependencies]
logos = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
