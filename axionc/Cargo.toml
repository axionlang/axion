[package]
name = "axionc"
version = "0.0.0"
edition = "2021"
description = "Fase 1 — esqueleto ambulante do compilador da Axion (parse → typecheck → correr), de raiz em Rust"
publish = false

[lib]
# `cdylib` so the wasm build emits a `.wasm` module (for the playground); `rlib` so
# the `axionc`/`axion-lsp` bins and the test harness link against the library.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "axionc"
path = "src/main.rs"
# The CLI drives the native backends (Cranelift/LLVM) + FFI, none of which build
# for wasm32; the `native` feature (default-on) carries them.
required-features = ["native"]

# The Language Server (§8). Gated behind `--features lsp` so the default build
# — and the tokio-free `--dev` fast path — stay lean.
[[bin]]
name = "axion-lsp"
path = "src/bin/lsp_main.rs"
required-features = ["lsp"]

[features]
# `cst` is on by default: the token-driven rowan CST is the compiler's PRIMARY
# parser (see `parse_source` — THE FLIP), proven byte-exact with the recursive-
# descent parser over every fixture. `rowan` is pure Rust, so the tokio-free
# `--dev` fast path stays C-toolchain-free. Build `--no-default-features` for the
# lean recursive-descent-only parser (the CST block is then `cfg`'d out).
default = ["cst", "native", "lsp"]
# The native backends (Cranelift `--dev` + LLVM `--release`) and the FFI runtime.
# Default-on; a `--no-default-features` wasm build drops them (they can't target
# wasm32) and runs programs through the interpreter instead.
native = ["dep:cranelift", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
# The salsa incremental query engine (§8). The LSP pulls it in so the server
# reuses memoized parses (prelude + unchanged imports) across edits.
salsa = ["dep:salsa"]
lsp = ["dep:tokio", "dep:tower-lsp", "salsa", "cst"]
# Lossless rowan CST (§8): the primary parse front-end (default-on) + the whole
# LSP's structural layer.
cst = ["dep:rowan"]
# The browser playground: compile + interpret Axion in wasm (front-end + `interp`
# only). Build: `cargo build --target wasm32-unknown-unknown --no-default-features
# --features wasm`, then `wasm-bindgen`. See `web/`.
wasm = ["cst", "dep:wasm-bindgen"]

[dependencies]
logos = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LSP server (optional — only under `--features lsp`).
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"], optional = true }
tower-lsp = { version = "0.20", optional = true }

# Incremental query engine (optional — `--features salsa`, pulled in by `lsp`).
salsa = { version = "0.28", optional = true }

# Lossless CST (optional — `--features cst`).
rowan = { version = "0.17", optional = true }

# Backend nativo --dev (§11/§18): o «Fast-Path Backend». Optional (`native`) so a
# wasm build can drop them (they don't target wasm32).
cranelift = { version = "0.116", optional = true }
cranelift-jit = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }

# Browser playground (optional — `--features wasm`). Pinned to match the local
# `wasm-bindgen` CLI (the crate and CLI versions must agree).
wasm-bindgen = { version = "=0.2.104", optional = true }

[profile.release]
opt-level = 2

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

missing_docs = "warn"
missing_debug_implementations = "warn"

unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

let_underscore_drop = "warn"
macro_use_extern_crate = "deny"
variant_size_differences = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Safe style/pedantic suppresses
must_use_candidate = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_lossless = "allow"
ptr_as_ptr = "allow"
default_trait_access = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
stable_sort_primitive = "allow"
needless_for_each = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
unnecessary_box_returns = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"

# Safety & Correctness
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
string_slice = "warn"
fallible_impl_from = "deny"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
mut_mut = "deny"
unimplemented = "warn"
redundant_pub_crate = "warn"
await_holding_lock = "warn"

# Performance
redundant_clone = "deny"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
manual_string_new = "warn"
useless_format = "warn"
implicit_clone = "deny"
clone_on_ref_ptr = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_futures = "warn"
ptr_arg = "warn"
option_if_let_else = "warn"
# `multiple_crate_versions` is a dependency-graph lint we cannot satisfy: the tree has
# unavoidable transitive major-version splits — `syn` 2 vs 3 (async-trait/displaydoc via
# tower-lsp + icu), `bitflags` 1 vs 2 (lsp-types/region via tower-lsp + cranelift-jit),
# and similar for hashbrown/rustc-hash/windows-sys. No `cargo update` can collapse them
# (different major deps require different majors), so under CI's `-D warnings` this lint
# would fail the build for a condition we don't control. Allowed.
multiple_crate_versions = "allow"

# Style
semicolon_if_nothing_returned = "warn"
similar_names = "deny"
enum_glob_use = "warn"
rc_buffer = "warn"


