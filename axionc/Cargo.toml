[package]
name = "axionc"
version = "0.0.0"
edition = "2021"
description = "Fase 1 — esqueleto ambulante do compilador da Axion (parse → typecheck → correr), de raiz em Rust"
publish = false

[[bin]]
name = "axionc"
path = "src/main.rs"

# The Language Server (§8). Gated behind `--features lsp` so the default build
# — and the tokio-free `--dev` fast path — stay lean.
[[bin]]
name = "axion-lsp"
path = "src/bin/lsp_main.rs"
required-features = ["lsp"]

[features]
# The salsa incremental query engine (§8). The LSP pulls it in so the server
# reuses memoized parses (prelude + unchanged imports) across edits.
salsa = ["dep:salsa"]
lsp = ["dep:tokio", "dep:tower-lsp", "salsa"]
# Lossless rowan CST (§8) — Stage 1 foundation, additive (does not yet drive
# analysis). Feature-gated so default/CLI builds stay lean.
cst = ["dep:rowan"]

[dependencies]
logos = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LSP server (optional — only under `--features lsp`).
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"], optional = true }
tower-lsp = { version = "0.20", optional = true }

# Incremental query engine (optional — `--features salsa`, pulled in by `lsp`).
salsa = { version = "0.28", optional = true }

# Lossless CST (optional — `--features cst`).
rowan = { version = "0.17", optional = true }

# Backend nativo --dev (§11/§18): o «Fast-Path Backend».
cranelift = "0.116"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-native = "0.116"

[profile.release]
opt-level = 2

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

missing_docs = "warn"
missing_debug_implementations = "warn"

unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

let_underscore_drop = "warn"
macro_use_extern_crate = "deny"
variant_size_differences = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Safe style/pedantic suppresses
must_use_candidate = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_lossless = "allow"
ptr_as_ptr = "allow"
default_trait_access = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
stable_sort_primitive = "allow"
needless_for_each = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
unnecessary_box_returns = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"

# Safety & Correctness
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
string_slice = "warn"
fallible_impl_from = "deny"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
mut_mut = "deny"
unimplemented = "warn"
redundant_pub_crate = "warn"
await_holding_lock = "warn"

# Performance
redundant_clone = "deny"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
manual_string_new = "warn"
useless_format = "warn"
implicit_clone = "deny"
clone_on_ref_ptr = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_futures = "warn"
ptr_arg = "warn"
option_if_let_else = "warn"
multiple_crate_versions = "warn"

# Style
semicolon_if_nothing_returned = "warn"
similar_names = "deny"
enum_glob_use = "warn"
rc_buffer = "warn"


