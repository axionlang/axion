name: ci

# Fase 0 — o andaime de CI. Tudo corre dentro do dev shell reprodutível do
# flake (mesmo GHC + linear-base em toda a parte), sem instalar toolchain à mão.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build (biblioteca + exe + testes)
        run: nix develop --command cabal build all

      - name: Testes (tasty — unidade + andaime de propriedades)
        run: nix develop --command cabal test --test-show-details=direct

      - name: Teste negativo (Buffer %1 usado 2x tem de FALHAR — AX0001)
        run: nix develop --command ./scripts/check-negative.sh

      - name: Formatação (fourmolu)
        run: nix develop --command fourmolu --mode check prototype

      - name: Lint (hlint)
        run: nix develop --command hlint prototype
