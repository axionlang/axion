name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fase 0 — a bancada EDSL (Haskell) corre no dev shell reprodutível do flake.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build (biblioteca + exe + testes)
        run: nix develop --command cabal build all

      - name: Testes (tasty — unidade + andaime de propriedades)
        run: nix develop --command cabal test --test-show-details=direct

      - name: Teste negativo (Buffer %1 usado 2x tem de FALHAR — AX0001)
        run: nix develop --command ./scripts/check-negative.sh

      - name: Formatação (fourmolu)
        run: nix develop --command fourmolu --mode check prototype

      - name: Lint (hlint)
        run: nix develop --command hlint prototype

  # Fase 1 — o compilador próprio (axionc, Rust): parse → typecheck → correr.
  axionc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axionc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      - name: Testes de integração (corre 01/02, rejeita AX0001/AX0002)
        run: cargo test --verbose

      - name: Formatação (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy, incl. testes)
        run: cargo clippy --all-targets -- -D warnings

  # Diferencial (§17): axionc e o oráculo GHC (bancada EDSL) têm de dar o mesmo
  # veredito de linearidade. Precisa de Rust (axionc) e Nix (GHC).
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@stable

      - name: axionc vs oráculo GHC
        run: ./scripts/differential.sh

  # Sanitizers (§2/§11): a memória segura sem GC tem de o ser de facto. O runtime
  # nativo (LLVM IR do --release + runtime C) corre sob AddressSanitizer (zero
  # uso-após-livre/dupla-free em todas as fixtures) e LeakSanitizer (allocs==frees
  # no subconjunto provado sem fugas). Precisa de Rust (axionc) e clang.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Runtime nativo sob ASan + LSan
        run: AXION_CLANG=clang ./scripts/sanitize.sh
