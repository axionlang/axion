name: ci

on:
  # This repo works on `main`: every push to it is checked. (`pull_request` is kept so a
  # PR, if anyone ever opens one, is also checked — but the normal flow is push to `main`.)
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run on the same ref when a newer push arrives (saves runner time
# on rapid re-pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 0 — the EDSL bench (Haskell) runs in the flake's reproducible dev shell.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build (library + exe + tests)
        run: nix develop --command cabal build all

      - name: Tests (tasty — unit + property scaffold)
        run: nix develop --command cabal test --test-show-details=direct

      - name: Negative test (a %1 Buffer used 2x must FAIL — AX0001)
        run: nix develop --command ./scripts/check-negative.sh

      - name: Formatting (fourmolu)
        run: nix develop --command fourmolu --mode check prototype

      - name: Lint (hlint)
        run: nix develop --command hlint prototype

  # Phase 1 — the own compiler (axionc, Rust): parse → typecheck → run.
  axionc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axionc
    steps:
      - uses: actions/checkout@v4
      # Pinned (not @stable): @stable silently drifts to the newest release, and on
      # 2026-08-30 it jumped to 1.98.0 whose new deny-by-default
      # `invalid_runtime_symbol_definitions` lint turned pre-existing code into a hard
      # build error, painting 4 jobs red at once. Bump this deliberately, not by drift.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      - name: Integration tests (runs 01/02, rejects AX0001/AX0002)
        run: cargo test --verbose

      - name: Formatting (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy, incl. testes)
        run: cargo clippy --all-targets -- -D warnings

  # Differential (§17): axionc and the GHC oracle (EDSL bench) must give the same
  # linearity verdict. Needs Rust (axionc) and Nix (GHC).
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: axionc vs the GHC oracle
        run: ./scripts/differential.sh

  # Δ (docs/delta-design.md + docs/delta-consolidation-plan.md): the linearity-judgment
  # gates. Two blocking gates: the snapshot oracle (every fixture's annotated `--emit core`
  # dump byte-matches the stored snapshot) and the Δ SOUNDNESS gate (the drop-balance
  # verifier proves no double-free/UAF/bad-free and no gate-worthy leak over the final Core
  # across the whole corpus — the authoritative, ASan-cross-checked, 0-FP judgment). The unit
  # suite in the `axionc` job additionally locks the dump format (annotated_dump_locks_format),
  # the verifier↔check_all subsumption (delta::tests::subsumes_*), and the coherence
  # cross-check. bench runs the same kernels on both Axion backends vs C/Rust and requires the
  # results to agree — a runtime correctness gate, not a timing assertion.
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Snapshot oracle (132 fixtures, --emit core)
        run: ./scripts/dump-oracle.sh

      # BLOCKING Δ SOUNDNESS GATE (docs/delta-consolidation-plan.md): the drop-balance
      # verifier (verify.rs, default-on AX0910/AX0911) proves no double-free/UAF/bad-free and
      # no gate-worthy leak over the FINAL Core across the whole corpus — the authoritative,
      # ASan-cross-checked, 0-false-positive linearity judgment. It was proven to SUBSUME the
      # legacy Δ checker below (delta::tests::subsumes_*), so this is the sound successor that
      # makes the Δ gate real and blocking again.
      - name: Δ soundness gate (drop-balance verifier over the corpus)
        run: ./scripts/verify-gate.sh

      # The legacy Δ checker (delta.rs::check_all) was removed (Δ-consolidation Steps 2-3,
      # docs/delta-consolidation-plan.md): the blocking Δ soundness gate above supersedes it
      # (proven to subsume it in Step 0). The coherence cross-check survives as the standalone,
      # non-soundness `scripts/check-coherence.sh` (--check-coherence), not run in CI.

      - name: Bench — Axion dev/rel vs C/Rust agree on every kernel
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          ./scripts/bench.sh

  # Sanitizers (§2/§11): GC-free memory safety has to actually be safe. The native
  # runtime (--release LLVM IR + C runtime) runs under AddressSanitizer (zero
  # use-after-free/double-free across all fixtures) and LeakSanitizer (allocs==frees
  # on the proven leak-free subset). Needs Rust (axionc) and clang.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Native runtime under ASan + LSan
        run: AXION_CLANG=clang ./scripts/sanitize.sh
      # Real-workload gate: the `pass` clone's commands over a NESTED store (fzf picker path) under
      # ASan — the exact shape two shipped double-frees lived in, which the fixture corpus missed.
      - name: pass(1) clone under ASan
        run: AXION_CLANG=clang ./scripts/pass-asan.sh
      # §11: the M:N session scheduler runs on a thread pool → race-freedom must be
      # proven too. The concurrent session fixtures run under ThreadSanitizer.
      - name: Session scheduler under ThreadSanitizer
        run: AXION_CLANG=clang ./scripts/tsan.sh

  # BEHAVIORAL — the `pass` clone must actually WORK end-to-end, not just be memory-safe. Stands up
  # a throwaway GnuPG keyring + password store and drives every command through interp/cranelift/llvm
  # (they must AGREE + produce the right on-disk/clipboard/QR effect). This is the gate that was
  # MISSING: pass-test.sh lived only on developer machines, so it silently rotted when `show` was
  # redesigned to clip-by-default (and that masked a native runCapture-stdin regression in `insert
  # -m`). PASS_TEST_REQUIRE=1 makes a missing gpg a HARD failure here — a silent skip is the trap.
  behavioral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # clang: the --release/LLVM backend + linking. gnupg: the throwaway keyring (ed25519,
      # %no-protection). qrencode: exercises `show -q`/`generate -q`'s REAL QR render path.
      - name: Install clang, gnupg, qrencode
        run: sudo apt-get update && sudo apt-get install -y clang gnupg qrencode
      - name: pass(1) clone behavioral test (gpg keyring, all backends)
        run: PASS_TEST_REQUIRE=1 ./scripts/pass-test.sh
      # The `fff` file-manager rewrite (examples/fff.axi) driven headlessly — a scripted key stream
      # at a throwaway tree (HOME sandboxed), asserting navigation frames + mkdir/mkfile/rename/
      # trash/copy/bulk-rename effects on every backend. Keeps the flagship + readKey/chr honest.
      - name: fff file-manager behavioral test (all backends)
        run: ./scripts/fff-test.sh
      # The `lambda` interpreter (examples/lambda.axi) — the third flagship, exercising the
      # functional core (recursive ADTs, deep copiers, an environment). Feeds source programs on
      # argv and asserts the evaluated result on every backend (interp == dev == release).
      - name: lambda interpreter behavioral test (all backends)
        run: ./scripts/lambda-test.sh

  # METATHEORY (Track 2) — the mechanized soundness proofs AND the faithfulness bridge (the Lean
  # model's verdict == the real verifier's) must hold. Previously run ONLY on developer machines, so
  # like pass-test.sh it could silently rot — a model that has drifted from the compiler proves
  # nothing. `bridge.sh` = check.sh (7 Lean files: AxionDrop/Alias/Key/Move/Extract/Session/Fidelity,
  # no `sorry`, axioms = propext/Quot.sound) + `cargo test --test bridge` (8 canonical shapes) +
  # model-trace.sh (the model agrees with the verifier over the whole in-fragment corpus, ~79%) +
  # exhaustive.sh (bounded-exhaustive: EVERY program in the drop/move/branch family up to size k).
  # Needs Nix (lean4) + Rust (axionc). ~4 min compute once lean4 is fetched.
  metatheory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Lean model soundness + faithfulness bridge (proofs ∧ verifier agreement)
        run: ./metatheory/bridge.sh
