# Phase 0 — minimal hlint configuration for the EDSL prototype.
- arguments: [-XLinearTypes, -XGHC2021]

# The linear idiom (consume-and-return) uses tuples and case-of-() on purpose;
# don't let hlint "simplify" what carries the ownership semantics.
- ignore: {name: "Use camelCase"}
- ignore: {name: "Redundant bracket"}
